<main class="flex items-center justify-center bg-gray-50 px-4">
    <section class="w-full max-w-lg rounded-2xl bg-white p-8 text-center shadow-lg sm:p-12"
        aria-labelledby="not-found-title">
        <div class="mx-auto mb-6 flex h-20 w-20 items-center justify-center rounded-full bg-indigo-100">
            <mat-icon class="not-found-icon text-indigo-600" aria-hidden="true">
                search_off
            </mat-icon>
        </div>

        <p class="not-found-code text-7xl font-extrabold tracking-tight text-indigo-600 sm:text-8xl">
            404
        </p>

        <h1 id="not-found-title" class="mt-4 text-2xl font-semibold text-gray-900 sm:text-3xl">
            Page not found
        </h1>

        <p class="mt-3 text-gray-600">
            The page you are looking for doesn't exist, has been moved,
            or the address was entered incorrectly.
        </p>

        <div class="mt-8 flex flex-col justify-center gap-3 sm:flex-row">
            <a mat-flat-button routerLink="/">
                <mat-icon>home</mat-icon>
                Home page
            </a>

            <button mat-stroked-button type="button" (click)="goBack()">
                <mat-icon>arrow_back</mat-icon>
                Go back
            </button>
        </div>
    </section>
</main>
