<mat-toolbar>
    <span class="color-red-500!">Meeting Manager</span>
    <span class="grow!"></span>
    @if (userService.isLoggedIn())
    {
    <a matIconButton matTooltip="Set your availability" routerLink="/availability">
        <mat-icon>event_available</mat-icon>
    </a>
    <a matIconButton matTooltip="Home" routerLink="/home">
        <mat-icon>home</mat-icon>
    </a>
    <button matIconButton matTooltip="Log out" (click)="logOut()">
        <mat-icon>logout</mat-icon>
    </button>
    }
    @else {
    <a matIconButton matTooltip="Log in" routerLink="/login">
        <mat-icon>login</mat-icon>
    </a>
    }
</mat-toolbar>

<router-outlet></router-outlet>
