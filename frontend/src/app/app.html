<mat-toolbar>
    <span class="color-red-500!">Meeting Manager</span>
    <span class="grow!"></span>
    @if (userService.isLoggedIn())
    {
    <span class="text-sm text-surface-on-variant">{{userService.currentUser()?.userName }}</span>
    <div class="border-l-2 border-gray-300 h-8 mx-3"></div>
    @if (userService.isAdministrator())
    {
    <a matIconButton matTooltip="Manage users" routerLink="/users">
        <mat-icon>supervisor_account</mat-icon>
    </a>
    }
    @if (userService.isOrganizer())
    {
    <a matIconButton matTooltip="Add new meeting" routerLink="/meeting/add">
        <mat-icon>calendar_add_on</mat-icon>
    </a>
    }
    <a matIconButton matTooltip="Set your availability" routerLink="/availability">
        <mat-icon>event_available</mat-icon>
    </a>
    <a matIconButton matTooltip="Home" routerLink="/home">
        <mat-icon>home</mat-icon>
    </a>
    <a matIconButton matTooltip="Account settings" routerLink="/settings">
        <mat-icon>settings</mat-icon>
    </a>
    <button matIconButton matTooltip="Log out" (click)="logOut()">
        <mat-icon>logout</mat-icon>
    </button>
    }
    @else {
    <a matIconButton matTooltip="Log in" routerLink="/login">
        <mat-icon>login</mat-icon>
    </a>
    }
</mat-toolbar>
<router-outlet></router-outlet>
